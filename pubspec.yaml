name: liquid_glass_native
description: "Native Apple Liquid Glass UI for Flutter on iOS 26+ — real SwiftUI/UIKit glass widgets (buttons, tab bar, sheets, pickers), not a blur fake. Graceful fallback below iOS 26."
version: 0.3.0
homepage: https://github.com/winterzxzz/flutter_native_view
repository: https://github.com/winterzxzz/flutter_native_view
issue_tracker: https://github.com/winterzxzz/flutter_native_view/issues
topics:
  - liquid-glass
  - ios
  - cupertino
  - glassmorphism
  - ui

# Shown in the pub.dev screenshot carousel; the first one is the search-result
# thumbnail. Captured from example/ on an iOS 26.5 simulator.
screenshots:
  - description: 'Native Liquid Glass buttons with SF Symbols and tints on iOS 26.'
    path: screenshots/pub_thumb.webp
  - description: 'Buttons, tab bar, switches, date picker and the shader glass lens.'
    path: screenshots/hero.webp
  - description: 'LiquidGlassTabBar - native iOS 26 tab bar with badges and a search accessory.'
    path: screenshots/tab_bar.webp
  - description: 'LiquidGlassButton - native glass buttons with leading/trailing SF Symbols.'
    path: screenshots/buttons.webp
  - description: 'LiquidGlassSwitch - native SwiftUI toggles inside glass cards.'
    path: screenshots/switch.webp
  - description: 'LiquidGlassDatePicker - native SwiftUI date pickers.'
    path: screenshots/date_picker.webp
  - description: 'LiquidGlassContainer - Flutter content layered on native glass panels.'
    path: screenshots/container.webp
  - description: 'LiquidGlassSlider - native SwiftUI sliders on Liquid Glass.'
    path: screenshots/slider.webp
  - description: 'LiquidGlass shader lens - cross-platform refraction and highlights.'
    path: screenshots/shader_glass.webp
  - description: 'Example gallery app listing every widget demo.'
    path: screenshots/gallery.webp

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
# Native plugin: glass is rendered by SwiftUI on iOS (authentic Liquid Glass on
# iOS 26+, graceful fallback below). Other platforms get a Flutter fallback.
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterNativeViewPlugin

  # Fragment shader powering the cross-platform (Impeller) Liquid Glass lens.
  shaders:
    - shaders/liquid_glass.frag

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
